<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" fill="none">
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDDCB5"/>
      <stop offset="100%" stop-color="#F5C8A0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B3F2B"/>
      <stop offset="100%" stop-color="#4A2518"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB4B4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFB4B4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Body / Shirt -->
  <path d="M90,310 Q90,290 110,280 L150,270 L190,280 Q210,290 210,310 L210,420 L90,420 Z" fill="url(#shirt)"/>
  <ellipse cx="150" cy="380" rx="70" ry="45" fill="url(#shirt)"/>
  <!-- Collar -->
  <path d="M130,280 L150,300 L170,280" fill="none" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <!-- Collar V -->
  <path d="M135,275 L150,295 L165,275" fill="none" stroke="#7EAED9" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="138" y="255" width="24" height="28" rx="8" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="150" cy="170" rx="72" ry="88" fill="url(#skin)"/>

  <!-- Hair - back volume -->
  <ellipse cx="150" cy="110" rx="78" ry="68" fill="url(#hair)"/>
  <!-- Hair - top -->
  <path d="M72,130 Q80,65 150,55 Q220,65 228,130" fill="url(#hair)"/>
  <!-- Hair - side left (wavy) -->
  <path d="M72,130 Q65,160 60,200 Q55,230 65,250 Q70,255 78,240 Q72,210 75,180 Q76,150 78,130" fill="url(#hair)"/>
  <!-- Hair - side right (wavy) -->
  <path d="M228,130 Q235,160 240,200 Q245,230 235,250 Q230,255 222,240 Q228,210 225,180 Q224,150 222,130" fill="url(#hair)"/>
  <!-- Hair - bangs -->
  <path d="M90,115 Q100,90 130,82 Q145,80 150,82 Q170,80 190,90 Q205,100 210,115 Q200,105 180,95 Q160,88 150,88 Q140,88 120,95 Q100,105 90,115" fill="url(#hair)"/>

  <!-- Ears -->
  <ellipse cx="78" cy="178" rx="10" ry="16" fill="#F5C8A0"/>
  <ellipse cx="222" cy="178" rx="10" ry="16" fill="#F5C8A0"/>

  <!-- Glasses -->
  <rect x="100" y="156" width="38" height="30" rx="12" fill="none" stroke="#4A5568" stroke-width="3"/>
  <rect x="162" y="156" width="38" height="30" rx="12" fill="none" stroke="#4A5568" stroke-width="3"/>
  <!-- Bridge -->
  <path d="M138,170 Q150,165 162,170" fill="none" stroke="#4A5568" stroke-width="2.5"/>
  <!-- Arms -->
  <line x1="100" y1="168" x2="80" y2="165" stroke="#4A5568" stroke-width="2"/>
  <line x1="200" y1="168" x2="220" y2="165" stroke="#4A5568" stroke-width="2"/>
  <!-- Lens reflection -->
  <ellipse cx="114" cy="165" rx="4" ry="3" fill="white" opacity="0.15"/>
  <ellipse cx="176" cy="165" rx="4" ry="3" fill="white" opacity="0.15"/>

  <!-- Eyes -->
  <ellipse cx="119" cy="171" rx="9" ry="8" fill="#3B2F2F"/>
  <circle cx="116" cy="168" r="3" fill="white" opacity="0.6"/>
  <ellipse cx="181" cy="171" rx="9" ry="8" fill="#3B2F2F"/>
  <circle cx="178" cy="168" r="3" fill="white" opacity="0.6"/>

  <!-- Eyebrows -->
  <path d="M102,148 Q119,140 136,147" fill="none" stroke="#4A2518" stroke-width="3" stroke-linecap="round"/>
  <path d="M164,147 Q181,140 198,148" fill="none" stroke="#4A2518" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M147,192 Q150,200 153,192" fill="none" stroke="#D4A574" stroke-width="2" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="102" cy="205" r="14" fill="url(#cheek)"/>
  <circle cx="198" cy="205" r="14" fill="url(#cheek)"/>

  <!-- Mouth - friendly smile -->
  <path d="M130,218 Q150,232 170,218" fill="none" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>

  <!-- Left arm holding book -->
  <path d="M95,305 Q70,320 55,350 Q50,365 55,375" fill="none" stroke="url(#shirt)" stroke-width="20" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="55" cy="375" r="12" fill="url(#skin)"/>

  <!-- Book -->
  <g transform="translate(30, 340) rotate(-20)">
    <rect x="0" y="0" width="55" height="40" rx="4" fill="url(#book)"/>
    <line x1="27.5" y1="0" x2="27.5" y2="40" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <!-- Pages -->
    <rect x="5" y="8" width="18" height="2" rx="1" fill="white" opacity="0.25"/>
    <rect x="5" y="14" width="15" height="2" rx="1" fill="white" opacity="0.25"/>
    <rect x="5" y="20" width="18" height="2" rx="1" fill="white" opacity="0.25"/>
    <rect x="32" y="8" width="18" height="2" rx="1" fill="white" opacity="0.25"/>
    <rect x="32" y="14" width="15" height="2" rx="1" fill="white" opacity="0.25"/>
    <rect x="32" y="20" width="18" height="2" rx="1" fill="white" opacity="0.25"/>
    <!-- Spine highlight -->
    <rect x="26" y="0" width="3" height="40" rx="1" fill="white" opacity="0.1"/>
  </g>

  <!-- Right arm -->
  <path d="M205,305 Q225,315 235,335" fill="none" stroke="url(#shirt)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="238" cy="340" r="12" fill="url(#skin)"/>
</svg>
